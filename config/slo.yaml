service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    A request is good only when it has a response_sent event within 3000 ms.
    The 99.5% target is provisional; confirm it against a representative baseline.
    A 0.5% budget allows 5 bad requests per 1000, or 50 per 10000.
    For N received requests, budget=floor(0.005*N), bad=N-good,
    remaining=budget-bad. Count requests without response_sent as bad after
    allowing in-flight requests time to finish.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
